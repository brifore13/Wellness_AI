services:
  postgres:
    image: postgres:16-alpine
    container_name: benny-postgres
    environment:
      POSTGRES_DB: wellness_ai
      POSTGRES_USER: benny
      POSTGRES_PASSWORD: benny_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benny"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
